# Urja Configuration
# /etc/slurm/urja.conf

# --- General ---
URJA_LIB=/data/urja/build/bin/liburja.so
URJA_PAPI_EVENTS=PAPI_TOT_CYC,PAPI_TOT_INS,PAPI_L3_TCM
URJA_INTERVAL_MS=500
URJA_ENERGY_BACKEND=sysfs
URJA_LOG_DIR=/data

# --- Default Logger (naive or trident) ---
URJA_LOGGER=naive

# --- Naive Settings ---
URJA_NAIVE_MAX_FREQ=2.80
URJA_NAIVE_MIN_FREQ=0.80
URJA_NAIVE_THRESHOLD=0.01

# --- Trident Settings ---
URJA_TRIDENT_MAX_FREQ=2.80
URJA_TRIDENT_MID_FREQ=1.40
URJA_TRIDENT_MIN_FREQ=0.80
URJA_TRIDENT_LOWER_THRESHOLD=0.01
URJA_TRIDENT_UPPER_THRESHOLD=0.02